<!DOCTYPE html>
<!--
  Hi Grandpa. Yes, I wrote this for you, from scratch.
  Happy 81st. Love, Maia
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Happy 81st, Grandpa</title>

  <!-- Link preview when texted -->
  <meta property="og:title" content="Happy 81st, Grandpa">
  <meta property="og:description" content="A birthday card from Maia">
  <meta property="og:image" content="https://maiakbard.github.io/happy-80/grandpa/preview.png">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="case">
    <header class="case-top">
      <span class="brand"><span class="brand-mark" aria-hidden="true"></span>BDAY</span>
      <span class="edition">PERSONAL EDITION</span>
    </header>

    <section class="screen" id="screen">
      <div class="display" id="display">
        <div class="screen-bar">
          <span>BDAY-OS / 8.1</span>
          <button class="mute" id="mute" aria-pressed="false">sound on</button>
        </div>
        <div class="terminal" id="terminal" aria-live="polite"></div>
      </div>

      <div class="power" id="power">
        <button class="power-btn" id="power-btn" aria-label="Power on">
          <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
            <path d="M12 3v8" />
            <path d="M6.3 6.8a8 8 0 1 0 11.4 0" />
          </svg>
        </button>
        <p>press to power on</p>
      </div>

      <button class="skip" id="skip" hidden>skip</button>
    </section>

    <nav class="commands" id="commands" aria-label="Commands" hidden>
      <button data-cmd="wish">wish</button>
      <button data-cmd="cake">cake</button>
      <button data-cmd="about">about</button>
      <button data-cmd="help">help</button>
    </nav>

    <footer class="case-bottom">
      <p class="tagline">81 years. One of a kind.</p>
      <div class="case-foot">
        <span>FOR GRANDPA, WITH LOVE</span>
        <span class="vents" aria-hidden="true"></span>
      </div>
    </footer>
  </main>

  <script src="main.js"></script>
</body>
</html>
